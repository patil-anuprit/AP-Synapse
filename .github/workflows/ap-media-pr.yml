name: AP Synapse - Stage Chat Native Universal Media Engine
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate new files before any patch
        run: |
          node --check backend/services/ap-media/engine.mjs
          node --check backend/services/ap-media/providers.mjs
          node --check backend/services/ap-media/intent.mjs
          node --check frontend/scripts/renderMediaJob.js
          node --test tests/*.test.mjs
      - name: Stage minimal chat integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "ap-media-${{ github.run_id }}"
          python3 scripts/ap-media-install.py
          node --check backend/server.js
          node --check frontend/scripts/chat.js
          git add backend/server.js frontend/scripts/chat.js
          git diff --cached --name-only
          git commit -m "Integrate native media generation in AP Synapse chat behind flags"
          git push origin "ap-media-${{ github.run_id }}"
      - name: Read this before merging
        run: |
          echo "Open GitHub Branches, compare ap-media-${{ github.run_id }} with main, create PR manually, inspect changes, then merge. Feature is OFF until environment enabled."
